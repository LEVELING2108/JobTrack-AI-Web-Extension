version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtrack_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-jobtrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtrack-network

volumes:
  postgres_data:
    driver: local

networks:
  jobtrack-network:
    driver: bridge
