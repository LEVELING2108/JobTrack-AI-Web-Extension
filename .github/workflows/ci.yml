name: JobTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Test & Verification
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend (Spring Boot 3.3 / Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw || true

      - name: Compile & Run Backend JUnit Tests
        working-directory: backend
        run: ./mvnw clean test

  # ----------------------------------------------------------------------------
  # 2. React Web Dashboard Build & Lint
  # ----------------------------------------------------------------------------
  web-ci:
    name: Web Dashboard (React 18 / Vite / TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck & Production Build
        working-directory: web
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Chrome Extension Test & Build Verification
  # ----------------------------------------------------------------------------
  extension-ci:
    name: Chrome Extension (Manifest V3 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Extension Dependencies
        working-directory: extension
        run: npm ci

      - name: Run Extension Unit Tests
        working-directory: extension
        run: npm test

      - name: Build Extension Artifacts
        working-directory: extension
        run: npm run build
