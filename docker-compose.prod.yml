services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jobtrack-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtrack_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-jobtrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtrack-prod-network

  # ----------------------------------------------------------------------------
  # 2. Spring Boot REST Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtrack-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jobtrack_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - jobtrack-prod-network

  # ----------------------------------------------------------------------------
  # 3. React Web Dashboard (Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jobtrack-web-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - jobtrack-prod-network

volumes:
  postgres_prod_data:
    driver: local

networks:
  jobtrack-prod-network:
    driver: bridge
